name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint • Typecheck • Test (Node for gero-lab, Bun for others)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bun toolchain
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install

      - name: Build
        run: bunx --bun turbo run build

      - name: Typecheck (monorepo)
        run: bunx --bun turbo run typecheck

      - name: Lint (monorepo)
        run: bunx --bun turbo run lint

      - name: Prettier check
        run: bunx --bun prettier -c .

      # ---------- Vitest ONLY for apps/gero-lab under Node ----------
      - name: Setup Node (for Vitest)
        uses: actions/setup-node@v4
        with:
          node-version: '22.x' # or '20.x' LTS

      - name: Test (apps/gero-lab • Vitest/Node)
        working-directory: apps/gero-lab
        run: |
          set -euxo pipefail
          # Ensure vitest is available (devDep at root or in this pkg)
          if [ -f node_modules/vitest/vitest.mjs ]; then
            node node_modules/vitest/vitest.mjs --run
          else
            node ../../node_modules/vitest/vitest.mjs --run
          fi

      # ---------- Bun tests for everything else ----------
      - name: Test (all other packages • Bun)
        run: bunx --bun turbo run test --filter=!gero-lab

      # Coverage (optional; keep if you generate reports)
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/
            .coverage
            coverage.*.json
            coverage-final.json
