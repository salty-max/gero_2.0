name: CI

on:
  push:
    branches: [main]
  pull_request:

# Avoid burning minutes on duplicate runs
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint • Typecheck • Test (Bun)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      # TypeScript type check via Turbo across packages
      - name: Typecheck (monorepo)
        run: bunx --bun turbo run typecheck

      # ESLint across packages
      - name: Lint (monorepo)
        run: bunx --bun turbo run lint

      # Optional: Prettier formatting check (comment out if you don't care)
      - name: Prettier check
        run: bunx --bun prettier -c .

      # Run package tests via Turbo
      - name: Test (packages)
        run: bunx --bun turbo run test

      # Run root tests (if any) for integration/legacy
      - name: Test (root)
        run: bun test --coverage

      # Upload coverage as an artifact (handy for PRs)
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/
            .coverage
            coverage.*.json
            coverage-final.json

      # Build via Turbo
      - name: Build (if present)
        shell: bash
        run: bun run build
