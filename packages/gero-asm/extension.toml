id = "gero-asm"
name = "Gero ASM"
version = "0.1.0"
schema_version = 1
description = "Zed language package for Gero ASM (Tree-sitter + optional LSP)"
authors = ["Maxime Blanc <max@jellycat.fr>"]
repository = "https://github.com/salty-max/gero_2.0/packages/gero-asm"

# Tree-sitter grammar source. Zed will build WASM itself.
# Use a local git checkout while developing:
[grammars.gero_asm]
wasm = "file:///Users/max/code/gero_2.0/packages/asm-gramma" # must be a git repo
rev = "HEAD"                                                 # or a specific commit SHA

# Optional: bundle your LSP
[language_servers.gero-asm-lsp]
name = "Gero ASM LSP"
languages = ["Gero ASM"]     # must match languages/<id>/config.toml name
command = "node"
args = ["server/asm-lsp.js"]
